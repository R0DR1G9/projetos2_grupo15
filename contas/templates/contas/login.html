{% extends "base.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<div class="container py-5 caixa-auth">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <h3 class="fw-bold text-center mb-4"><i class="bi bi-box-arrow-in-right text-success me-2"></i>Entrar</h3>

            {% if form.errors %}
                <div class="alert alert-danger">Usuário ou senha incorretos.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="mb-3">
                    <label class="form-label fw-bold">Usuário</label>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Senha</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success fw-bold">Entrar</button>
                </div>
            </form>

            <p class="text-center text-muted small mt-3 mb-0">
                Ainda não tem conta? <a href="{% url 'cadastro' %}">Criar conta</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
