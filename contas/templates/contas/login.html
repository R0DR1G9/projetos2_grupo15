{% extends "base_auth.html" %}

{% block title %}Entrar{% endblock %}

{% block content %}
<h1>Bem-vindo!</h1>
<p class="auth-subtitulo">Entre na sua conta para continuar.</p>

{% if form.errors %}
    <div class="alert alert-danger">Usuário ou senha incorretos.</div>
{% endif %}

<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="mb-3">
        <label class="form-label" for="id_username">Usuário</label>
        <input type="text" name="username" id="id_username" class="form-control" placeholder="Seu usuário" required autofocus>
    </div>
    <div class="mb-4">
        <label class="form-label" for="id_password">Senha</label>
        <input type="password" name="password" id="id_password" class="form-control" placeholder="Digite sua senha" required>
    </div>
    <div class="d-grid">
        <button type="submit" class="btn btn-success fw-bold auth-botao">Entrar</button>
    </div>
</form>

<p class="auth-rodape">Ainda não tem uma conta?<a href="{% url 'cadastro' %}">Cadastrar</a></p>
{% endblock %}
