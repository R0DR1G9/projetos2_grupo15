name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Verificar a configuração do Django
        run: python manage.py check

      - name: Verificar se há migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Rodar os testes automatizados
        run: python manage.py test

  e2e:
    name: Testes E2E (Selenium)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes de sistema com Selenium
        run: python manage.py test e2e --pattern="e2e_*.py" --verbosity 2

  deploy:
    name: Deploy na Vercel
    runs-on: ubuntu-latest
    needs: [testes, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar as dependências
        run: pip install -r requirements.txt

      - name: Aplicar as migrações no banco de produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py migrate --noinput

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Publicar em produção
        run: vercel deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
