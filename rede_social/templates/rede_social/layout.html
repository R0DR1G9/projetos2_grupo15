{% extends "rede_social/base.html" %}
{% block conteudo %}
<div class="rs">
  <div class="rs-grade">
    <main class="rs-principal">{% block principal %}{% endblock %}</main>
    <aside class="rs-lateral">
      <section class="rs-card">
        <h2>Seu perfil</h2>
        <p><a href="{% url 'rede_social:perfil' user.get_username %}">Ver meu perfil</a></p>
        <p><a href="{% url 'rede_social:editar_perfil' %}">Editar perfil</a></p>
      </section>
      {% include "rede_social/_lateral.html" %}
    </aside>
  </div>

  <div class="rs-lightbox" id="rs-lightbox" role="dialog" aria-modal="true" aria-label="Imagem ampliada" hidden>
    <button class="rs-lightbox-fechar" id="rs-lightbox-fechar" type="button" aria-label="Fechar">✕</button>
    <img id="rs-lightbox-img" alt="">
  </div>
</div>

<script>
(function () {
  var caixa = document.getElementById("rs-lightbox");
  var img = document.getElementById("rs-lightbox-img");
  var fechar = document.getElementById("rs-lightbox-fechar");
  var origem = null;
  var fechando = false;
  var reduzido = window.matchMedia("(prefers-reduced-motion: reduce)");

  // A imagem "cresce" a partir do ponto onde estava a miniatura.
  function definirOrigem(miniatura) {
    img.style.transformOrigin = "";
    if (!miniatura) return;
    var w = img.offsetWidth, h = img.offsetHeight;
    if (!w || !h) return;                       // ainda sem tamanho: cresce do centro
    var t = miniatura.getBoundingClientRect();
    var ox = t.left + t.width / 2 - (caixa.clientWidth - w) / 2;
    var oy = t.top + t.height / 2 - (caixa.clientHeight - h) / 2;
    img.style.transformOrigin = ox + "px " + oy + "px";
  }

  function abrir(link) {
    var miniatura = link.querySelector("img");
    origem = link;
    fechando = false;
    caixa.classList.remove("fechando");
    img.src = link.getAttribute("href");
    img.alt = miniatura ? miniatura.alt : "";
    caixa.hidden = false;
    definirOrigem(miniatura);
    document.body.style.overflow = "hidden";
    fechar.focus({ preventScroll: true });
  }

  function terminarFechamento() {
    caixa.hidden = true;
    caixa.classList.remove("fechando");
    img.removeAttribute("src");
    img.style.transformOrigin = "";
    document.body.style.overflow = "";
    fechando = false;
    if (origem) origem.focus({ preventScroll: true });
  }

  function fecharCaixa() {
    if (caixa.hidden || fechando) return;
    if (reduzido.matches) { terminarFechamento(); return; }
    fechando = true;
    caixa.classList.add("fechando");
    setTimeout(terminarFechamento, 220);        // mesma duração da animação no CSS
  }

  document.addEventListener("click", function (e) {
    var link = e.target.closest("[data-rs-zoom]");
    if (link) {
      // Ctrl/Cmd/Shift/botão do meio: mantém o comportamento normal do navegador
      if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
      e.preventDefault();
      abrir(link);
      return;
    }
    // clicar no fundo escuro ou no ✕ fecha; clicar na própria imagem não
    if (!caixa.hidden && e.target !== img && caixa.contains(e.target)) fecharCaixa();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") fecharCaixa();
  });
})();

/* Curtir sem recarregar a página.
   Sem JavaScript (ou se algo falhar) o formulário continua funcionando do jeito antigo. */
(function () {
  function rotulo(curtido, total) {
    return (curtido ? "♥ Curtido" : "♡ Curtir") + " (" + total + ")";
  }

  // Atualiza todos os botões do mesmo post na página (ex.: o post e um repost dele).
  function aplicar(form, curtido, total) {
    var acao = form.getAttribute("action");
    var botoes = document.querySelectorAll('form[data-rs-curtir][action="' + acao + '"] button');
    botoes.forEach(function (b) {
      b.classList.toggle("ativa", curtido);
      b.setAttribute("aria-pressed", curtido ? "true" : "false");
      b.textContent = rotulo(curtido, total);
    });
  }

  function animar(botao) {
    botao.classList.remove("pop");
    void botao.offsetWidth;                 // reinicia a animação
    botao.classList.add("pop");
    botao.addEventListener("animationend", function fim() {
      botao.classList.remove("pop");
      botao.removeEventListener("animationend", fim);
    });
  }

  document.addEventListener("submit", function (e) {
    var form = e.target;
    if (!form.matches || !form.matches("form[data-rs-curtir]")) return;
    e.preventDefault();

    var botao = form.querySelector("button");
    if (botao.getAttribute("aria-busy") === "true") return;      // evita clique duplo

    var estavaCurtido = botao.classList.contains("ativa");
    var m = botao.textContent.match(/\((\d+)\)/);
    var totalAntes = m ? parseInt(m[1], 10) : 0;

    // Resposta imediata (otimista); o servidor confirma em seguida.
    aplicar(form, !estavaCurtido, Math.max(0, totalAntes + (estavaCurtido ? -1 : 1)));
    if (!estavaCurtido) animar(botao);
    botao.setAttribute("aria-busy", "true");

    fetch(form.action, {
      method: "POST",
      body: new FormData(form),
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest", "Accept": "application/json" }
    })
      .then(function (r) {
        var json = (r.headers.get("content-type") || "").indexOf("application/json") !== -1;
        if (r.redirected || !json) { var err = new Error("sessao"); err.sessao = true; throw err; }
        if (!r.ok) throw new Error("http " + r.status);
        return r.json();
      })
      .then(function (d) { aplicar(form, d.curtido, d.total); })
      .catch(function (err) {
        aplicar(form, estavaCurtido, totalAntes);                 // desfaz
        if (err.sessao) form.submit();                            // sessão expirada: fluxo normal (login)
      })
      .then(function () { botao.removeAttribute("aria-busy"); });
  });
})();
</script>
{% endblock %}
