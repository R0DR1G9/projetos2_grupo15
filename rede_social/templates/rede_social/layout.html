{% extends "rede_social/base.html" %}
{% load static %}
{% block conteudo %}
<div class="rs">
  <div class="rs-grade">
    <main class="rs-principal">{% block principal %}{% endblock %}</main>
    <aside class="rs-lateral">
      <section class="rs-card">
        <h2>Seu perfil</h2>
        <p><a href="{% url 'rede_social:perfil' user.get_username %}">Ver meu perfil</a></p>
        <p><a href="{% url 'rede_social:editar_perfil' %}">Editar perfil</a></p>
      </section>
      {% include "rede_social/_lateral.html" %}
    </aside>
  </div>

  <div class="rs-lightbox" id="rs-lightbox" role="dialog" aria-modal="true" aria-label="Imagem ampliada" hidden>
    <button class="rs-lightbox-fechar" id="rs-lightbox-fechar" type="button" aria-label="Fechar">✕</button>
    <img id="rs-lightbox-img" alt="">
  </div>
</div>

{% endblock %}
{% block extra_scripts %}<script src="{% static 'rede_social/js/layout.js' %}"></script>{% endblock %}
